# Requirement slots for the compliance engine (MASTER_SPEC Part 3 section 4). Loaded into analytics.rh_requirements by scripts/load_rh_requirements.py.
# Numeric thresholds and clause numbers are NOT filled in: the official documents (Building Code Acceptable Solutions, Ngā Paerewa) sit behind bot challenges
# (www.building.govt.nz, www.health.govt.nz) and are not bypassed. Drop the PDFs in docs/sources_manual/standards/; then fill `value`, `clause`, `source_url`, `last_verified` here.
# check: how the engine tests it from the Property Record / plan model. Blank value => status is UNKNOWN or NEEDS_PROFESSIONAL, never PASS.
