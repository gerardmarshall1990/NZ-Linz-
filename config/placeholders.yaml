    label: Minimum acceptable profit (per year, per home)
    basis: cautious
    source: "No published source for YOUR requirement. Deliberately demanding: about $5,000 per bed for 30 beds. Context only: a 2024 Ansell Strategic study (as reported by Grant Thornton NZ: https://www.grantthornton.co.nz/insights/budget-2024-aged-care/) found average operator EBITDA of about $3.94 per occupied bed per day (about $1,440 a year). Depends on the deal: use the per-deal box."
